services:
  nfs-server:
    build: ./docker/nfs-server
    container_name: nfs-server
    hostname: nfs-server
    privileged: true
    networks:
      - nfs-net
    healthcheck:
      test: ["CMD", "cat", "/etc/exports"]
      interval: 10s
      timeout: 5s
      retries: 3

  client-1:
    image: alpine:3.19
    container_name: client-1
    command: tail -f /dev/null
    volumes:
      - nfs_shared_volume:/mnt/nfs
    networks:
      - nfs-net
    depends_on:
      nfs-server:
        condition: service_healthy

  client-2:
    image: alpine:3.19
    container_name: client-2
    command: tail -f /dev/null
    volumes:
      - nfs_shared_volume:/mnt/nfs
    networks:
      - nfs-net
    depends_on:
      nfs-server:
        condition: service_healthy

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    command:
      - '--path.rootfs=/host'
      - '--collector.nfsd'
      - '--collector.textfile'
      - '--collector.textfile.directory=/host/tmp'
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - nfs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9100/metrics"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    volumes:
      - ../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - nfs-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../config/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../config/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - nfs-net
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  nfs_shared_volume:
    driver: local
    driver_opts:
      type: nfs
      o: addr=nfs-server,vers=4,rw,nolock,tcp
      device: ":/srv/nfs/share"
  prometheus_data:

networks:
  nfs-net:
    driver: bridge
